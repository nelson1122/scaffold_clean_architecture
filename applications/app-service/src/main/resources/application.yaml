server:
  port: 8080
spring:
  application:
    name: "ms-customer-statistics"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    active: "dev"
    include: null

aws:
  region: "us-east-1"
  dynamodb:
    endpoint: "http://localhost:8010"
    accessKey: '1234'
    secretAccessKey: '1234'
    table-name: "tbl-customer-statistics-dev-dy"
  rabbit:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
